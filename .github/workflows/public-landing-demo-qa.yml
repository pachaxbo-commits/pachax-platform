name: Public landing and demo QA

on:
  pull_request:
    paths:
      - 'src/public/landing/**'
      - 'src/public/config/**'
      - 'src/admin/store/commercialConfigStore.ts'
      - 'src/demo/quick-retail/**'
      - 'scripts/landingCommercialTestFixture.mjs'
      - 'scripts/test-public-landing-*.mjs'
      - 'scripts/test-demo-app-integration*.mjs'
      - 'scripts/tests/landingCommercialTestFixture.test.mjs'
      - 'docs/landing-test-fixtures.md'
      - 'package.json'
      - 'package-lock.json'
      - 'vite*.config.ts'
      - 'vercel.json'
      - '.github/workflows/public-landing-demo-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-landing-demo-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-landing-demo-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Install project dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Focused ESLint
        run: npx eslint src/public/landing/PlatformExtrasSection.tsx src/public/landing/TemplatePricingSection.tsx scripts/test-public-landing-browser.mjs scripts/test-demo-app-integration-browser.mjs scripts/landingCommercialTestFixture.mjs scripts/test-public-landing-regression.mjs scripts/tests/landingCommercialTestFixture.test.mjs

      - name: Build emulator and isolated demos
        run: npm run build:emulator

      - name: Verify test-only commercial fixtures
        run: npm run test:landing-fixtures

      - name: Full landing regression with empty and synthetic catalogs
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:landing-browser

      - name: Gateway-unavailable editorial fallback regression
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:public-catalog-fallback-browser

      - name: Isolated demo and landing integration
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:demos-app-integration

      - name: Firebase isolation, demo routes, and isolated build guard
        run: |
          npm run test:preview-firebase-isolation
          npm run test:free-demo-routes
          npm run test:demos-only:guard
