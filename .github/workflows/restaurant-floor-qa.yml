name: Restaurant floor QA
on:
  pull_request:
    paths:
      - 'src/modules/restaurant/**'
      - 'src/demo/restaurant/**'
      - 'functions/restaurant.cjs'
      - 'firebase/tests/restaurantOperations.test.mjs'
      - 'scripts/test-restaurant-floor-browser.mjs'
      - '.github/workflows/restaurant-floor-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: restaurant-floor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  restaurant-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: browser-actions/setup-chrome@v1
        if: hashFiles('scripts/test-restaurant-floor-browser.mjs') != ''
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: npm ci && npm ci --prefix functions
      - run: npm install --global firebase-tools@15.5.1
      - run: npm run typecheck
      - run: npx eslint src/modules/restaurant/components/RestaurantFloorCanvas.tsx src/modules/restaurant/components/RestaurantTables.tsx src/modules/restaurant/domain/restaurantFloor.ts src/modules/restaurant/domain/restaurantFloorEditorPolicy.ts src/modules/restaurant/domain/__tests__/restaurantFloorEditorPolicy.test.ts src/demo/restaurant/RestaurantDemo.tsx scripts/test-restaurant-floor-browser.mjs
        if: hashFiles('scripts/test-restaurant-floor-browser.mjs') != ''
      - run: npm run test:restaurant
      - run: npm run test:restaurant-backend
      - run: npm run build:emulator
      - run: npm run test:restaurant-floor-browser
        if: hashFiles('scripts/test-restaurant-floor-browser.mjs') != ''
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:preview-firebase-isolation && npm run test:free-demo-routes && npm run test:demos-only:guard
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('scripts/test-restaurant-floor-browser.mjs') != ''
        with:
          name: restaurant-floor-browser
          path: docs/restaurant-floor-evidence/
