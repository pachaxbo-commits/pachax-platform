<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradRetail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05141c" />
      <stop offset="60%" stop-color="#092230" />
      <stop offset="100%" stop-color="#030c12" />
    </linearGradient>
    <linearGradient id="retailTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shadowRetail" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bgGradRetail)" />

  <!-- Top Status Bar -->
  <rect x="24" y="24" width="552" height="44" rx="8" fill="#0b2636" stroke="#16435c" stroke-width="1" />
  <circle cx="48" cy="46" r="6" fill="#14B8A6" />
  <text x="64" y="51" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">VENTAS EXPRESS</text>
  <text x="210" y="51" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Punto de Venta · Conexión a Báscula · Cobro Ágil</text>
  <rect x="475" y="32" width="85" height="28" rx="6" fill="url(#retailTeal)" />
  <text x="517" y="50" fill="#FFFFFF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">CAJA RÁPIDA</text>

  <!-- Left: Mostrador & Báscula -->
  <g filter="url(#shadowRetail)">
    <rect x="24" y="86" width="310" height="268" rx="12" fill="#08202d" stroke="#174763" stroke-width="1" />
    <text x="44" y="116" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">BALANZA Y LECTURA EN VIVO</text>

    <!-- Scale Display -->
    <rect x="44" y="132" width="270" height="74" rx="8" fill="#0c2f42" stroke="#14B8A6" stroke-width="1.5" />
    <text x="56" y="156" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">PESO BALANZA RS232 / USB</text>
    <text x="56" y="188" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">0.325 kg</text>
    <text x="180" y="186" fill="#14B8A6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Bs 19.50</text>
    <text x="56" y="200" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Precio unitario: Bs 60.00 / kg</text>

    <!-- Fast keys -->
    <text x="44" y="234" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">BOTONERA TÁCTIL RÁPIDA</text>
    <rect x="44" y="244" width="84" height="42" rx="6" fill="#133d54" />
    <text x="86" y="269" fill="#FFFFFF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Bebidas</text>

    <rect x="137" y="244" width="84" height="42" rx="6" fill="#133d54" />
    <text x="179" y="269" fill="#FFFFFF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Fiambres</text>

    <rect x="230" y="244" width="84" height="42" rx="6" fill="#133d54" />
    <text x="272" y="269" fill="#FFFFFF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Snacks</text>

    <rect x="44" y="296" width="270" height="42" rx="6" fill="#0f4561" />
    <text x="179" y="322" fill="#38BDF8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">COBRO EN 1 CLICK · ESCANEO DIRECTO</text>
  </g>

  <!-- Right: Ticket y Factura -->
  <g filter="url(#shadowRetail)">
    <rect x="350" y="86" width="226" height="268" rx="12" fill="#08202d" stroke="#174763" stroke-width="1" />
    <text x="366" y="116" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">TICKET ACTUAL</text>

    <text x="366" y="146" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">1x Queso Criollo (325g)</text>
    <text x="540" y="146" fill="#FFFFFF" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">19.50</text>

    <text x="366" y="172" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">2x Jugo Natural 500ml</text>
    <text x="540" y="172" fill="#FFFFFF" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">24.00</text>

    <line x1="366" y1="192" x2="556" y2="192" stroke="#174763" stroke-width="1" />

    <text x="366" y="218" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">TOTAL COBRO</text>
    <text x="556" y="222" fill="#FFFFFF" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">Bs 43.50</text>

    <rect x="366" y="246" width="190" height="38" rx="6" fill="#14B8A6" />
    <text x="461" y="270" fill="#FFFFFF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">PAGO RÁPIDO EFECTIVO</text>

    <rect x="366" y="294" width="190" height="38" rx="6" fill="#0f4561" />
    <text x="461" y="318" fill="#FFFFFF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">QR SIMPLE INMEDIATO</text>
  </g>
</svg>
